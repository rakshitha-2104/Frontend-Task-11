<!DOCTYPE html>
<HTML lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width,initial-scaler=1.0">
        <title>My Image Gallery</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="gallery-container">
            <header>
                <h1> My Gallery</h1>
                <p>Explore the beauty of the world of images</p>
            </header>
            <div class="gallery-card">
                <div class="image-container">
                    <img id="galleryImage" src="" alt="Gallery Image">
                </div>
                <h2 id="imageCaption">Beautiful Memories</h2>
                <p id="imageNumber">Image 1 of 4</p>
                <div class="dots-container" id="dotsContainer"></div>
                <div class="button-container"></div>
                <button id="prevBtn" class="nav-btn"> Previous </button>
                <button id="playBtn" class="play-btn"> Play </button>
                <button id="nextBtn" class="nav-btn"> Next </button>
                <script src="script.js"></script>
            </div>
        </div>
    </body>
</HTML>
